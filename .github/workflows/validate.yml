name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run structural manifest/skill validation
        run: uv run tools/validate.py

      - name: Run validator test suite
        run: uv run pytest -q
