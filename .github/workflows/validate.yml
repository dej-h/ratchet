name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: tools/diagrams/.node-version
          cache: npm
          cache-dependency-path: |
            tools/diagrams/package-lock.json
            skills/diagram-loop/renderer/package-lock.json

      - name: Install locked diagram renderer
        working-directory: tools/diagrams
        run: npm ci

      - name: Install locked premium diagram renderer
        working-directory: skills/diagram-loop/renderer
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run repository structural validation
        run: uv run tools/validate.py

      - name: Check canonical Mermaid renders
        id: diagram_check
        working-directory: tools/diagrams
        run: npm run diagrams:check

      - name: Regenerate runner renders after drift
        if: failure() && steps.diagram_check.outcome == 'failure'
        id: diagram_diagnostic
        working-directory: tools/diagrams
        run: npm run diagrams:diagnose -- "${RUNNER_TEMP}/canonical-diagram-renders"

      - name: Upload runner renders after drift
        if: failure() && steps.diagram_diagnostic.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-diagram-renders-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-diagram-renders
          if-no-files-found: error
          retention-days: 7

      - name: Run diagram renderer contract tests
        working-directory: tools/diagrams
        run: npm test

      - name: Type-check premium diagram renderer
        working-directory: skills/diagram-loop/renderer
        run: npm run typecheck

      - name: Run premium diagram renderer contract tests
        working-directory: skills/diagram-loop/renderer
        run: npm test

      - name: Run premium diagram media smoke
        working-directory: skills/diagram-loop/renderer
        run: npm run test:media

      - name: Run validator test suite
        run: uv run pytest -q

      - name: Smoke-test installed renderer from a read-only plugin tree
        run: |
          chmod -R a-w skills/diagram-loop
          RATCHET_DIAGRAM_CACHE_ROOT="${RUNNER_TEMP}/diagram-loop-cache" node skills/diagram-loop/scripts/run-renderer.mjs init --repo-key ci --slug read-only-smoke
          test -f "${HOME}/.claude/diagram-loops/ci/read-only-smoke/state.md"
