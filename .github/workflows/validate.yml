name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: tools/diagrams/.node-version
          cache: npm
          cache-dependency-path: tools/diagrams/package-lock.json

      - name: Install locked diagram renderer
        working-directory: tools/diagrams
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run repository structural validation
        run: uv run tools/validate.py

      - name: Check canonical Mermaid renders
        id: diagram_check
        working-directory: tools/diagrams
        run: npm run diagrams:check

      - name: Regenerate runner renders after drift
        if: failure() && steps.diagram_check.outcome == 'failure'
        working-directory: tools/diagrams
        run: npm run diagrams:write

      - name: Upload runner renders after drift
        if: failure() && steps.diagram_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-diagram-renders-${{ github.sha }}
          path: |
            docs/diagrams/cache-lookup-icons-dark.svg
            docs/diagrams/cache-lookup-icons-light.svg
            docs/diagrams/voortman-fullstack-deploy-icons-dark.svg
            docs/diagrams/voortman-fullstack-deploy-icons-light.svg
          retention-days: 7

      - name: Run diagram renderer contract tests
        working-directory: tools/diagrams
        run: npm test

      - name: Run validator test suite
        run: uv run pytest -q
