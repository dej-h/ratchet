[project]
name = "ratchet"
version = "0.3.0"
description = "Phase-gated SWE workflow for coding agents"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]
